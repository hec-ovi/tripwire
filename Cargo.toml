[package]
name = "tripwire"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parse(serialize(x)) == x, or verify reports false hash mismatches.
# Never enable preserve_order: sorted keys make the log canonical.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
toml = "1.1.6"
